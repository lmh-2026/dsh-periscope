# dsh-periscope bundle patch: inserts the periscope row over the profile root.
# All values come from schema defaults; override them in YOUR profile's
# cordis.patch.yml (this bundle layer is applied before the user layer, and a
# user patch replaces the whole row config), e.g.:
#
#   - id: periscope
#     config:
#       provider: deepseek-official
#       textModels: [deepseek-v4-flash, deepseek-v4-pro]
#       visionModel: deepseek-v4-flash-vision-exp
#
# The provider must be a registered LLM route whose catalog contains the text
# models (no image input) and the vision model (declares image input). Any
# image-bearing request routed to one of textModels is auto-dispatched on
# visionModel; text-only requests stay on the text model.
- insert:
    - id: periscope
      name: 'dsh-periscope'
